// Deceipt native adapter — Android library (A5 scope).
//
// A plain `com.android.library` module exposing ONE hand-written legacy
// ReactContextBaseJavaModule named "DeceiptNative" (see
// app/src/native/DeceiptNative.ts and modules/deceipt-native/index.ts). No
// codegen spec: the frozen TypeScript contract is the single source of truth.

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.deceipt.adapter"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // JVM unit tests exercise the radio-independent protocol/crypto path.
        testOptions {
            unitTests {
                includeAndroidResources = false
                returnDefaultValues = false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        // Protocol/crypto/session live in the pure-JVM :deceipt-protocol module.
        // This module holds only the Android surfaces (BLE, Keystore, RN bridge).
        main.java.srcDirs = ["src/main/java"]
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("org.jetbrains.kotlin:kotlin-stdlib")
    // The frozen protocol core (radio-independent, unit-tested on the JVM).
    implementation(project(":deceipt-protocol"))
}
